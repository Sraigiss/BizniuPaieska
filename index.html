<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Spark - Unwebbed Business Finder</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --bg-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; margin: 0; padding: 0; color: var(--text-main); }

        .header {
            background: var(--bg-gradient);
            color: white;
            padding: 40px 20px 60px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
        }

        .header h1 { margin: 0 0 10px 0; font-size: 2.2rem; }
        .header p { margin: 0; opacity: 0.9; font-size: 1.1rem; }

        .container { max-width: 900px; margin: -30px auto 40px auto; padding: 0 20px; }

        .search-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 15px;
        }

        @media (max-width: 650px) { .input-group { grid-template-columns: 1fr; } }

        input[type="text"], select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn-search {
            padding: 14px 28px;
            background: var(--bg-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }

        .btn-search:hover { transform: translateY(-2px); }

        .chips-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
        .chips-label { font-size: 13px; color: #64748b; font-weight: 600; }

        .chip {
            background: #f1f5f9;
            color: #475569;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #cbd5e1;
        }

        .chip:hover { background: #e2e8f0; color: var(--primary); }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 15px 0;
            padding: 0 5px;
        }

        .results-count { font-size: 14px; font-weight: 600; color: #64748b; }
        .results-list { display: flex; flex-direction: column; gap: 15px; }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h3 { margin: 0 0 8px 0; color: #0f172a; font-size: 18px; }
        .card-info p { margin: 4px 0; color: #64748b; font-size: 14px; }

        .badge-no-website {
            background: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            margin-top: 8px;
        }

        .rating-box { text-align: right; min-width: 100px; }
        .rating-score { font-size: 18px; font-weight: 800; color: #f59e0b; }

        .maps-link {
            display: inline-block;
            margin-top: 8px;
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .status-msg {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            color: #64748b;
            border: 2px dashed #cbd5e1;
        }

        .load-more-container {
            text-align: center;
            margin-top: 25px;
        }

        .btn-load-more {
            background: #ffffff;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-load-more:hover {
            background: var(--primary);
            color: #ffffff;
        }

        .error-alert {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        #map { display: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>🚀 Lead Spark</h1>
    <p>Discover local businesses without websites & win your next client</p>
</div>

<div class="container">

    <div id="api-error-alert" class="error-alert">
        <strong>⚠️ Google Maps API Error:</strong> Check console for details.
    </div>

    <div class="search-card">
        <div class="input-group">
            <input id="location-input" type="text" placeholder="📍 Select City (e.g., Vilnius)..." autocomplete="off">
            
            <select id="business-type">
                <option value="establishment">🎲 Any / All Businesses</option>
                <option value="restaurant" selected>🍽️ Restaurants & Dining</option>
                <option value="cafe">☕ Cafes & Bakeries</option>
                <option value="store">🛍️ Shopping & Stores</option>
                <option value="car_repair">🚗 Auto Repair & Mechanics</option>
                <option value="beauty_salon">💇 Hair & Beauty Salons</option>
                <option value="plumber">🔧 Plumbers</option>
                <option value="electrician">⚡ Electricians</option>
                <option value="dentist">🦷 Dentists & Clinics</option>
                <option value="gym">🏋️ Gyms & Fitness</option>
            </select>

            <button class="btn-search" onclick="startSearch()">Search</button>
        </div>

        <div class="chips-container">
            <span class="chips-label">Popular:</span>
            <span class="chip" onclick="quickSelect('establishment')">🎲 Any / All</span>
            <span class="chip" onclick="quickSelect('restaurant')">🍽️ Restaurants</span>
            <span class="chip" onclick="quickSelect('cafe')">☕ Cafes</span>
            <span class="chip" onclick="quickSelect('car_repair')">🚗 Auto Repair</span>
            <span class="chip" onclick="quickSelect('beauty_salon')">💇 Salons</span>
        </div>
    </div>

    <div class="controls">
        <div style="display: flex; align-items: center; gap: 8px;">
            <label for="sort-by" style="font-size: 14px; font-weight: 600;">Sort by:</label>
            <select id="sort-by" style="width: auto; padding: 8px 12px;" onchange="applySortingAndRender()">
                <option value="reviews-desc">🔥 Most Reviews</option>
                <option value="rating-desc">⭐ Highest Rating</option>
                <option value="rating-asc">⚠️ Lowest Rating</option>
            </select>
        </div>
        <div id="results-count" class="results-count">0 leads found</div>
    </div>

    <div id="results" class="results-list">
        <div class="status-msg">
            Enter a city above and press <strong>Search</strong> to scan a 30 km radius!
        </div>
    </div>

    <div class="load-more-container">
        <button id="btn-load-more" class="btn-load-more" style="display: none;" onclick="loadNextBatch()">🔄 Load More Results</button>
    </div>

</div>

<div id="map"></div>

<!-- PASTE YOUR API KEY HERE -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAng9LjzznGw6JTXoI2NQoXlqcNjjGqQNY&libraries=places&callback=initAutocomplete" async defer></script>

<script>
    let autocomplete;
    let placesService;
    let geocoder;
    let rawResults = [];
    let selectedPlaceLocation = null;
    let nextPagePagination = null;

    function gm_authFailure() {
        document.getElementById('api-error-alert').style.display = 'block';
    }

    function initAutocomplete() {
        try {
            const input = document.getElementById("location-input");
            autocomplete = new google.maps.places.Autocomplete(input, {
                types: ["(cities)"]
            });

            autocomplete.addListener("place_changed", () => {
                const place = autocomplete.getPlace();
                if (place && place.geometry) {
                    selectedPlaceLocation = place.geometry.location;
                }
            });

            placesService = new google.maps.places.PlacesService(document.getElementById("map"));
            geocoder = new google.maps.Geocoder();
        } catch (e) {
            console.error("Google Maps failed to load:", e);
            document.getElementById('api-error-alert').style.display = 'block';
        }
    }

    function quickSelect(typeValue) {
        document.getElementById('business-type').value = typeValue;
    }

    function startSearch() {
        const locationText = document.getElementById("location-input").value;
        const selectedType = document.getElementById("business-type").value;
        const resultsContainer = document.getElementById("results");

        if (!locationText) {
            alert("Please type and select a city!");
            return;
        }

        resultsContainer.innerHTML = '<div class="status-msg">🔍 Scanning 30 km radius for registered businesses without websites...</div>';
        document.getElementById("btn-load-more").style.display = "none";
        rawResults = [];
        nextPagePagination = null;

        if (!selectedPlaceLocation) {
            geocoder.geocode({ address: locationText }, (results, status) => {
                if (status === "OK" && results[0]) {
                    selectedPlaceLocation = results[0].geometry.location;
                    executeNearbySearch(selectedPlaceLocation, selectedType);
                } else {
                    resultsContainer.innerHTML = '<div class="status-msg">❌ Could not locate coordinates for this city. Please pick from the dropdown suggestions.</div>';
                }
            });
        } else {
            executeNearbySearch(selectedPlaceLocation, selectedType);
        }
    }

    function executeNearbySearch(location, type) {
        let request = {
            location: location,
            radius: 30000,
            type: type
        };

        placesService.nearbySearch(request, (results, status, pagination) => {
            if (status === google.maps.places.PlacesServiceStatus.OK && results) {
                // Save pagination token for the Load More button
                nextPagePagination = pagination && pagination.hasNextPage ? pagination : null;
                processWebsiteCheck(results);
            } else {
                if (rawResults.length === 0) {
                    document.getElementById("results").innerHTML = '<div class="status-msg">❌ No businesses found for this category within a 30 km radius.</div>';
                    document.getElementById("results-count").innerText = "0 leads found";
                }
            }
        });
    }

    function loadNextBatch() {
        if (nextPagePagination && nextPagePagination.hasNextPage) {
            const btn = document.getElementById("btn-load-more");
            btn.innerText = "⏳ Fetching next batch...";
            btn.disabled = true;

            // Google requires a brief pause before activating the next page token
            setTimeout(() => {
                nextPagePagination.nextPage();
            }, 1200);
        }
    }

    function processWebsiteCheck(places) {
        let pendingDetails = places.length;

        places.forEach((placeResult) => {
            placesService.getDetails(
                {
                    placeId: placeResult.place_id,
                    fields: ["name", "formatted_address", "formatted_phone_number", "rating", "user_ratings_total", "website", "url"]
                },
                (details, detailStatus) => {
                    pendingDetails--;

                    if (detailStatus === google.maps.places.PlacesServiceStatus.OK && details) {
                        // KEEP ONLY BUSINESSES WITHOUT A WEBSITE FIELD
                        if (!details.website) {
                            rawResults.push(details);
                        }
                    }

                    if (pendingDetails === 0) {
                        applySortingAndRender();
                    }
                }
            );
        });
    }

    function applySortingAndRender() {
        const sortBy = document.getElementById("sort-by").value;
        const resultsContainer = document.getElementById("results");
        const loadMoreBtn = document.getElementById("btn-load-more");

        if (rawResults.length === 0) {
            resultsContainer.innerHTML = '<div class="status-msg">🎉 All registered businesses found in this batch have websites listed on Google Maps!</div>';
            document.getElementById("results-count").innerText = "0 leads found";
            loadMoreBtn.style.display = "none";
            return;
        }

        rawResults.sort((a, b) => {
            const ratingA = a.rating || 0;
            const ratingB = b.rating || 0;
            const reviewsA = a.user_ratings_total || 0;
            const reviewsB = b.user_ratings_total || 0;

            if (sortBy === "reviews-desc") return reviewsB - reviewsA;
            if (sortBy === "rating-desc") return ratingB - ratingA;
            if (sortBy === "rating-asc") return ratingA - ratingB;
        });

        document.getElementById("results-count").innerText = `${rawResults.length} potential client(s) found within 30 km!`;
        resultsContainer.innerHTML = "";

        rawResults.forEach((biz) => {
            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <div class="card-info">
                    <h3>${biz.name}</h3>
                    <p>📍 ${biz.formatted_address || "Address not listed"}</p>
                    <p>📞 ${biz.formatted_phone_number || "Phone not listed"}</p>
                    <span class="badge-no-website">🚫 No Website Found</span>
                </div>
                <div class="rating-box">
                    <div class="rating-score">⭐ ${biz.rating || "N/A"}</div>
                    <div style="font-size: 12px; color: #64748b; margin-top: 2px;">${biz.user_ratings_total || 0} reviews</div>
                    ${biz.url ? `<a href="${biz.url}" target="_blank" class="maps-link">View Map ↗</a>` : ""}
                </div>
            `;
            resultsContainer.appendChild(card);
        });

        // Show/Hide "Load More" button based on Google pagination status
        if (nextPagePagination && nextPagePagination.hasNextPage) {
            loadMoreBtn.style.display = "inline-block";
            loadMoreBtn.innerText = "🔄 Load More Results";
            loadMoreBtn.disabled = false;
        } else {
            loadMoreBtn.style.display = "none";
        }
    }
</script>

</body>
</html>
